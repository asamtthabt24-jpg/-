<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة زفاف - روى و يزن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FCFBF8;
    --blue-deep: #35577F;
    --blue-deeper: #223a56;
    --blue-mid: #6D8FB8;
    --blue-light: #B7CBE2;
    --blue-pale: #E4ECF4;
    --gold: #C6A03C;
    --gold-light: #E4CE8F;
    --gold-dark: #8f7326;
    --ink: #2E3B4A;
    --ink-soft: #5F6E7E;
    --pink-deep: #9E2F55;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    min-height:100vh;
  }

  .stage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 30px 14px;
  }

  /* wrapper that holds the card + the doors, gives 3D perspective, clips to card shape */
  .frame{
    position:relative;
    width:100%;
    max-width: 420px;
    aspect-ratio: 3/4.3;
    border-radius: 4px;
    overflow:hidden;
    box-shadow: 0 24px 60px rgba(53,87,127,0.18);
    perspective: 1500px;
    background: var(--bg);
  }

  .card{
    position:relative;
    width:100%;
    height:100%;
    background: var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 40px 26px 30px;
    text-align:center;
  }

  /* pause all entrance animations of the invitation content until the door has opened */
  body:not(.opened) .content,
  body:not(.opened) .content *{
    animation-play-state: paused !important;
  }

  /* ---------- corner floral art ---------- */
  .bloom{
    position:absolute;
    width: 62%;
    max-width:280px;
    opacity:0;
    transform: scale(0.4) rotate(-8deg);
    animation: bloomIn 1.3s cubic-bezier(.2,.9,.3,1.1) forwards;
  }
  .bloom.tl{ top:-8%; left:-10%; animation-delay:0.15s; }
  .bloom.br{ bottom:-8%; right:-10%; transform: scale(0.4) rotate(180deg); animation-delay:0.3s; }
  @keyframes bloomIn{
    0%{ opacity:0; transform: scale(0.35) rotate(-10deg); }
    100%{ opacity:1; transform: scale(1) rotate(0deg); }
  }
  @keyframes bloomInFlip{
    0%{ opacity:0; transform: scale(0.35) rotate(190deg); }
    100%{ opacity:1; transform: scale(1) rotate(180deg); }
  }
  .bloom.br{ animation-name: bloomInFlip; }

  .petal-drift{
    position:absolute;
    top:-30px;
    width:10px; height:10px;
    border-radius: 60% 0 60% 0;
    background: #E58CA0;
    opacity:0.55;
    animation: drift 9s linear infinite;
  }
  .petal-drift:nth-child(1){ left:20%; animation-delay:0.5s; }
  .petal-drift:nth-child(2){ left:55%; animation-delay:3s; background:var(--gold-light); width:7px; height:7px; }
  .petal-drift:nth-child(3){ left:80%; animation-delay:5.5s; background:#F0A9BF; }
  @keyframes drift{
    0%{ transform: translateY(-30px) rotate(0deg); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.4; }
    100%{ transform: translateY(560px) rotate(200deg); opacity:0; }
  }

  .flower-inner{
    transform-box: fill-box;
    transform-origin: center;
    animation: flowerLive 6s ease-in-out infinite;
  }
  .flower-inner.f1{ animation-duration: 5.5s; animation-delay: 0s; }
  .flower-inner.f2{ animation-duration: 6.4s; animation-delay: 0.6s; }
  .flower-inner.f3{ animation-duration: 5.8s; animation-delay: 1.1s; }
  @keyframes flowerLive{
    0%{ transform: rotate(-10deg) scale(1); }
    50%{ transform: rotate(10deg) scale(1.1); }
    100%{ transform: rotate(-10deg) scale(1); }
  }
  .vine-line{
    animation: vineSway 7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes vineSway{
    0%,100%{ transform: rotate(-1.5deg); }
    50%{ transform: rotate(1.5deg); }
  }

  /* ---------- content ---------- */
  .content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    height:100%;
  }

  .title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size: clamp(60px, 17vw, 80px);
    color: var(--pink-deep);
    line-height:1;
    opacity:0;
    transform: translateY(-14px);
    animation: fadeDown 0.9s ease forwards;
    animation-delay: 0.6s;
  }

  @keyframes fadeDown{
    to{ opacity:1; transform: translateY(0); }
  }

  .title-rule{
    width: 130px;
    height:1px;
    background: var(--gold);
    margin: 10px auto 12px;
    position:relative;
    transform: scaleX(0);
    transform-origin:center;
    animation: growLine 0.8s ease forwards;
    animation-delay: 1s;
  }
  .title-rule::before{
    content:'✦';
    position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    background: var(--bg);
    color: var(--gold);
    font-size:11px;
    padding:0 8px;
  }
  @keyframes growLine{ to{ transform: scaleX(1); } }

  .day-label{
    font-family:'Aref Ruqaa', serif;
    font-size: 22px;
    color: var(--pink-deep);
    margin-bottom: 8px;
    opacity:0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.05s;
  }

  .date{
    font-size: 20px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    margin-bottom: 22px;
    opacity:0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.15s;
  }

  .lead{
    font-size: 13.5px;
    line-height: 2.05;
    color: var(--ink);
    max-width: 280px;
    margin-bottom: 16px;
    opacity:0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.35s;
  }

  .invite-line{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 20px;
    opacity:0;
    animation: fadeUp 0.8s ease forwards;
    animation-delay: 1.55s;
  }

  .names-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 16px;
    margin-bottom: 26px;
    opacity:0;
    transform: scale(0.85);
    animation: popIn 0.8s cubic-bezier(.2,.9,.3,1.2) forwards;
    animation-delay: 1.75s;
  }
  @keyframes popIn{
    to{ opacity:1; transform: scale(1); }
  }
  .names-row .name{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size: clamp(24px, 6vw, 30px);
    color: var(--pink-deep);
  }
  .names-row .amp{
    font-family:'Aref Ruqaa', serif;
    font-size: 26px;
    color: var(--gold);
  }

  .site-link{
    margin-top:4px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 12px 26px;
    border-radius: 999px;
    text-decoration:none;
    font-family:'Tajawal', sans-serif;
    font-weight:500;
    font-size: 13.5px;
    letter-spacing: 0.4px;
    color: var(--bg);
    background: linear-gradient(135deg, var(--pink-deep), #7a2140);
    box-shadow:
      0 6px 16px rgba(158,47,85,0.35),
      inset 0 0 0 1px rgba(230,206,143,0.55);
    opacity:0;
    transform: translateY(10px);
    animation: fadeUp 0.8s ease forwards, linkBreathe 2.6s ease-in-out infinite;
    animation-delay: 1.95s, 2.85s;
    transition: box-shadow 0.25s ease;
  }
  @keyframes linkBreathe{
    0%,100%{
      transform: scale(1);
      box-shadow:
        0 6px 16px rgba(158,47,85,0.35),
        inset 0 0 0 1px rgba(230,206,143,0.55);
    }
    50%{
      transform: scale(1.045);
      box-shadow:
        0 9px 22px rgba(158,47,85,0.5),
        inset 0 0 0 1px rgba(230,206,143,0.9);
    }
  }
  .site-link:hover,
  .site-link:focus-visible{
    box-shadow:
      0 10px 22px rgba(158,47,85,0.45),
      inset 0 0 0 1px rgba(230,206,143,0.8);
  }
  .site-link:active{
    transform: scale(0.98);
  }
  .site-link-icon{
    width:16px; height:16px;
    transform: rotate(180deg);
    transition: transform 0.25s ease;
  }
  .site-link:hover .site-link-icon{
    transform: rotate(180deg) translateX(3px);
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* =========================================================
     DOOR
     ========================================================= */
  .doors{
    position:absolute;
    inset:0;
    z-index: 20;
    display:flex;
    cursor:pointer;
  }
  .doors.opened{
    pointer-events:none;
  }

  .door{
    position:relative;
    width:50%;
    height:100%;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .door-left{
    transform-origin: left center;
    transform: rotateY(0deg);
  }
  .door-right{
    transform-origin: right center;
    transform: rotateY(0deg);
  }
  .doors.opened .door-left{
    animation: swingLeft 1.15s cubic-bezier(.33,.99,.42,1) forwards;
  }
  .doors.opened .door-right{
    animation: swingRight 1.15s cubic-bezier(.33,.99,.42,1) forwards;
  }
  @keyframes swingLeft{
    0%{ transform: rotateY(0deg); }
    72%{ transform: rotateY(-112deg); }
    100%{ transform: rotateY(-100deg); }
  }
  @keyframes swingRight{
    0%{ transform: rotateY(0deg); }
    72%{ transform: rotateY(112deg); }
    100%{ transform: rotateY(100deg); }
  }

  .door-face{
    position:absolute;
    inset:0;
    background:
      repeating-linear-gradient(90deg,
        rgba(255,255,255,0.06) 0px,
        rgba(255,255,255,0.06) 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px),
      linear-gradient(160deg, #F0A9BF 0%, #D6738F 45%, #9E2F55 100%);
    box-shadow:
      inset 0 0 0 6px var(--gold),
      inset 0 0 0 8px var(--gold-dark);
    overflow:hidden;
    backface-visibility: hidden;
  }
  .door-left .door-face{ border-radius: 4px 0 0 4px; }
  .door-right .door-face{ border-radius: 0 4px 4px 0; }

  .door-inset{
    position:absolute;
    top: 10%;
    bottom: 10%;
    left: 12%;
    right: 12%;
    border: 2px solid var(--gold-light);
    border-radius: 6px;
    box-shadow:
      inset 0 0 18px rgba(122,33,64,0.35),
      inset 0 0 0 6px rgba(230,140,168,0.3);
  }
  .door-inset::before,
  .door-inset::after{
    content:'';
    position:absolute;
    width: 16px; height:16px;
    border: 2px solid var(--gold-light);
    border-radius:50%;
  }
  .door-inset::before{ top: -9px; left: -9px; }
  .door-inset::after{ bottom: -9px; right: -9px; }

  /* half medallion that meets in the middle to form a full circle when closed */
  .door-medallion{
    position:absolute;
    top:50%;
    width: 46px;
    height: 92px;
    transform: translateY(-50%);
    overflow:hidden;
  }
  .door-left .door-medallion{ right:-1px; border-radius: 46px 0 0 46px; }
  .door-right .door-medallion{ left:-1px; border-radius: 0 46px 46px 0; }
  .door-medallion-inner{
    position:absolute;
    top:0; left:0;
    width: 92px; height: 92px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold) 55%, var(--gold-dark) 100%);
    box-shadow: inset 0 0 6px rgba(0,0,0,0.35);
  }
  .door-right .door-medallion-inner{ left:-46px; }
  .door-medallion-inner::after{
    content:'';
    position:absolute;
    inset: 14px;
    border-radius:50%;
    border: 2px solid rgba(158,47,85,0.55);
  }

  .door-handle{
    position:absolute;
    top:50%;
    width: 14px;
    height: 46px;
    transform: translateY(-50%);
    background: linear-gradient(180deg, var(--gold-light), var(--gold-dark));
    border-radius: 7px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 0 2px rgba(255,255,255,0.6);
  }
  .door-left .door-handle{ right: 26px; }
  .door-right .door-handle{ left: 26px; }

  .door-shade{
    position:absolute;
    inset:0;
    background: linear-gradient(90deg, rgba(122,33,64,0.5), rgba(122,33,64,0));
    opacity:0;
    pointer-events:none;
    backface-visibility: hidden;
  }
  .door-right .door-shade{ background: linear-gradient(-90deg, rgba(122,33,64,0.5), rgba(122,33,64,0)); }
  .doors.opened .door-left .door-shade{ animation: shadeFade 1.15s ease forwards; }
  .doors.opened .door-right .door-shade{ animation: shadeFade 1.15s ease forwards; }
  @keyframes shadeFade{
    0%{ opacity:0; }
    55%{ opacity:0.7; }
    100%{ opacity:0; }
  }

  .door-glow{
    position:absolute;
    top:0; bottom:0; left:50%;
    width: 0px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(230,206,143,0.85), rgba(230,206,143,0) 70%);
    z-index: 21;
    opacity:0;
    pointer-events:none;
  }
  .doors.opened ~ .door-glow,
  .doors.opened .door-glow{
    animation: glowPulse 1s ease forwards;
  }
  @keyframes glowPulse{
    0%{ width:0; opacity:0; }
    30%{ width:70px; opacity:0.9; }
    100%{ width: 260px; opacity:0; }
  }

  .door-hint{
    position:absolute;
    left:50%; top:50%;
    transform: translate(-50%,-50%);
    z-index: 22;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    color: var(--gold-light);
    text-align:center;
    pointer-events:none;
  }
  .door-hint .tap-icon{
    width:34px; height:34px;
    animation: tapPulse 1.6s ease-in-out infinite;
  }
  .door-hint .hint-text{
    font-family:'Aref Ruqaa', serif;
    font-size: 17px;
    letter-spacing: 1px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  @keyframes tapPulse{
    0%,100%{ transform: scale(1); opacity:0.85; }
    50%{ transform: scale(1.12); opacity:1; }
  }
  .doors.opened .door-hint{
    animation: hintOut 0.4s ease forwards;
  }
  @keyframes hintOut{
    to{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .content, .content *{ animation: none !important; }
    .door-left, .door-right{ transition: transform 0.6s ease; }
    .doors.opened .door-left{ animation:none; transform: rotateY(-100deg); }
    .doors.opened .door-right{ animation:none; transform: rotateY(100deg); }
  }
</style>
</head>

<script>
  const doors = document.getElementById('doors');

  function playDoorSound(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();

      // --- creak: filtered noise sweeping in pitch as the hinge turns ---
      const dur = 1.0;
      const bufferSize = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++){
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize * 0.3);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 9;
      filter.frequency.setValueAtTime(260, ctx.currentTime);
      filter.frequency.linearRampToValueAtTime(520, ctx.currentTime + 0.25);
      filter.frequency.linearRampToValueAtTime(340, ctx.currentTime + 0.55);
      filter.frequency.linearRampToValueAtTime(700, ctx.currentTime + 0.8);
      filter.frequency.linearRampToValueAtTime(200, ctx.currentTime + dur);

      const creakGain = ctx.createGain();
      creakGain.gain.setValueAtTime(0.0001, ctx.currentTime);
      creakGain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.12);
      creakGain.gain.linearRampToValueAtTime(0.14, ctx.currentTime + 0.6);
      creakGain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + dur);

      noise.connect(filter);
      filter.connect(creakGain);
      creakGain.connect(ctx.destination);
      noise.start();
      noise.stop(ctx.currentTime + dur);

      // --- soft wooden thud as the door reaches full open ---
      setTimeout(() => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(95, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(38, ctx.currentTime + 0.25);

        const thudGain = ctx.createGain();
        thudGain.gain.setValueAtTime(0.28, ctx.currentTime);
        thudGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);

        osc.connect(thudGain);
        thudGain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.32);
      }, 780);

    }catch(e){ /* audio not available - animation still plays */ }
  }

  doors.addEventListener('click', function(){
    if (doors.classList.contains('opened')) return;
    doors.classList.add('opened');
    document.body.classList.add('opened');
    playDoorSound();
  });
</script>
